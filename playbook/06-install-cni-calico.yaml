---
- hosts: k8s-master
  tasks:
    - name: Install the Tigera Calico operator and custom resource definitions
      ansible.builtin.command: kubectl apply -f https://projectcalico.docs.tigera.io/manifests/tigera-operator.yaml
      register: install_calico
      failed_when: install_calico.rc != 0

    - name: Download configuration file of calico resources
      ansible.builtin.command: curl https://projectcalico.docs.tigera.io/manifests/custom-resources.yaml -o /tmp/custom-resources.yaml
      register: calico_yaml
      failed_when: calico_yaml.rc != 0

    - name: Read the content of calico resources
      ansible.builtin.command:
        cmd: cat /tmp/custom-resources.yaml
      register: content
      failed_when: content.rc != 0

    - name: Set calico cidr
      ansible.builtin.set_fact:
        calico_config: "{{ content.stdout | set_calico_cidr(cidr.range) }}"

    - name: Write back the modified configuration file
      ansible.builtin.copy:
        content: "{{ calico_config }}"
        dest: /tmp/calico-custom-resources.yaml

    - name: Apply calico custom resources settings
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/calico-custom-resources.yaml